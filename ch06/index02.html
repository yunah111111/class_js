<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch06 index02.html 파일</h1>
    <script>
      const timer = {
        seconds: 3,
        label: "요리 타이머",
        start: function () {
          console.log(this.label + " 시작 " + this.seconds + "초");

          setTimeout(function () {
            console.log(this.label + ": 요리 끝");
          }, 3000);
        },
      };

      timer.start();
      // 이 메서드 안에 콜백 함수에서 사용하고 있는 this는 window를 가리킨다.

      console.log("3. forEach에서도 같은 일이 발생함");

      const shop = {
        name: "코딩상점",
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          // 여기서의 this는 shop을 가리킨다.
          console.log("[[[" + this.name + "]]]");
          this.products.forEach(function (products) {
            console.log(this.name + " - " + products);
            // 이 시점의 this는 window이다.
          });
        },
      };

      shop.printAll();

      console.log("4. 옛날 방식의 해결: this를 다른 변수에 담아두기");

      const shop2 = {
        name: "코딩상점",
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          const self = this; // 메서드 안에서 this가 shop2일 때 변수에 담아둔다.
          this.products.forEach(function (products) {
            console.log(self.name2 + " - " + products);
            // 이 시점의 this는 window이다.
          });
        },
      };

      shop2.printAll();
    </script>
  </body>
</html>
