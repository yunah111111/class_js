<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .item {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100px;
        height: 100px;
        background-color: aqua;
        margin-right: 10px;
        margin-top: 10px;
      }

      #box {
        display: flex;
        flex-direction: row;
      }
    </style>
  </head>
  <body>
    <h1>ch12 index05.html - 요소 동적 추가</h1>
    <button id="btn1">아이템 추가</button>
    <button id="btn2">아이템 삭제</button>
    <div id="box">
      <div class="item">아이템 1</div>
      <div class="item">아이템 2</div>
      <div class="item">아이템 3</div>
    </div>

    <script>
      let count = 3;
      // 1. 버튼 요소 찾고 이벤트 리스너 등록
      const btn1 = document.getElementById("btn1");
      const box = document.getElementById("box");
      btn1.addEventListener("click", function () {
        const newItem = document.createElement("div");
        newItem.classList.add("item");
        // newItem.style.marginRight = "10px";
        // newItem.style.marginTop = "10px";
        // newItem.style.backgroundColor = "aqua";
        newItem.textContent = `아이템${++count}`;
        // newItem.clientWidth = "100px";
        // newItem.clientHeight = "100px";
        box.append(newItem);
      });

      const btn2 = document.getElementById("btn2");
      btn2.addEventListener("click", function () {
        const lastItem = box.lastElementChild;
        if (lastItem) {
          lastItem.remove();
        }
      });
    </script>
  </body>
</html>
